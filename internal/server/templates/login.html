<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO Roundtable — Owner Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 100%; max-width: 380px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 1rem; font-size: 0.875rem; color: #94a3b8; }
        input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 0.6rem; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; margin-top: 0.25rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; margin-top: 1.5rem; padding: 0.75rem; border-radius: 4px; border: none; background: #0284c7; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #0369a1; }
        .error { background: #ef444422; border: 1px solid #ef4444; color: #fca5a5; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>NEO Roundtable</h1>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <label for="principal">Owner Principal</label>
            <input type="text" id="principal" name="principal" value="{{.Principal}}" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
